[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claimback-backend"
version = "0.1.0"
description = "Autonomous Financial Recovery Assistant Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "boto3>=1.28.0",
    "strands-agents>=1.0.0",
    "strands-agents-tools>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "openai>=1.0.0",
    "python-multipart>=0.0.20",
    "pypdf>=5.0.0"
]
